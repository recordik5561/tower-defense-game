// Sound (Web Audio API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if (type === 'shoot') { osc.frequency.value = 600; gain.gain.value = 0.08; osc.type = 'square'; }
  else if (type === 'hit') { osc.frequency.value = 300; gain.gain.value = 0.1; osc.type = 'sawtooth'; }
  else if (type === 'place') { osc.frequency.value = 400; gain.gain.value = 0.12; osc.type = 'sine'; }
  else if (type === 'death') { osc.frequency.value = 150; gain.gain.value = 0.15; osc.type = 'triangle'; }
  else if (type === 'wave') { osc.frequency.value = 800; gain.gain.value = 0.1; osc.type = 'sine'; }
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.stop(audioCtx.currentTime + 0.15);
}

// Progress saving (привязан к Telegram user.id)
let playerProgress = { storyLevel: 0, bestEndless: 0, totalGoldEarned: 0 };
let telegramUser = null;

function getTelegramUser() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    telegramUser = tg.initDataUnsafe.user;
    return telegramUser;
  }
  return null;
}

function getProgressKey() {
  const user = getTelegramUser();
  return user ? `td_progress_${user.id}` : 'td_progress_local';
}

async function loadProgress() {
  const user = getTelegramUser();
  // Сначала пытаемся с бэкенда
  if (user && backendUrl !== 'https://your-backend.example.com') {
    try {
      const res = await fetch(`${backendUrl}/api/progress?userId=${user.id}`);
      if (res.ok) {
        const data = await res.json();
        if (data.progress) {
          playerProgress = { ...playerProgress, ...data.progress };
          localStorage.setItem(getProgressKey(), JSON.stringify(playerProgress));
          return;
        }
      }
    } catch (e) {}
  }
  // Fallback на localStorage
  const saved = localStorage.getItem(getProgressKey());
  if (saved) playerProgress = { ...playerProgress, ...JSON.parse(saved) };
}

function saveProgress() {
  const key = getProgressKey();
  localStorage.setItem(key, JSON.stringify(playerProgress));
  const user = getTelegramUser();
  if (user && backendUrl !== 'https://your-backend.example.com') {
    fetch(backendUrl + '/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        userId: user.id, 
        username: user.username || null,
        firstName: user.first_name || null,
        progress: playerProgress 
      })
    }).catch(() => {});
  }
}

    levels: [

let currentChapter = 0;
let currentLevelInChapter = 0;

const towerStats = {
  archer: { cost: 50, range: 130, damage: 18, cooldown: 550, color: '#4a7c59', upgradeCost: [40, 80] },
  cannon: { cost: 100, range: 100, damage: 45, cooldown: 1100, color: '#666', upgradeCost: [70, 140] },
  mage: { cost: 150, range: 140, damage: 30, cooldown: 700, color: '#66f', upgradeCost: [100, 200] },

};

const towerImages = {
  archer: ['90c5b99f-41e3-4002-8eb9-96e248b19463.jpg', '304e54c0-be6c-4826-bf4e-d77c7aa10b91.jpg', '2eb84762-cf9e-44ed-af72-12dbb0f5b4bf.jpg'],
  cannon: ['03ff1852-100e-4ac9-99fc-2906b186bcae.jpg', '88048fa0-579e-4145-8cf0-88cfd3145719.jpg'],
  mage: ['eb26ee4b-0ba6-4113-862e-7abceec3423e.jpg', '0897b7f5-815c-400e-b3cd-a92679fb5d38.jpg'],

};

function generatePath() {
  path = [
    {x: -40, y: H*0.45},
    {x: W*0.15, y: H*0.42},
    {x: W*0.22, y: H*0.28},
    {x: W*0.38, y: H*0.32},
    {x: W*0.45, y: H*0.55},
    {x: W*0.58, y: H*0.48},
    {x: W*0.65, y: H*0.65},
    {x: W*0.78, y: H*0.58},
    {x: W*0.88, y: H*0.42},
    {x: W+40, y: H*0.38}
  ];
}

function startStory() { 
  mode = 'story'; 
  // Восстанавливаем прогресс
  const total = playerProgress.storyLevel || 0;
  currentChapter = Math.floor(total / 10);
  currentLevelInChapter = total % 10;
  if (currentChapter >= chapters.length) currentChapter = chapters.length - 1;
  document.getElementById('menu').style.display = 'none'; 
  showStory(); 
}
function showStory() {
  document.getElementById('story-screen').style.display = 'flex';
  const ch = chapters[currentChapter];
  let text = "";
  if (currentLevelInChapter === 0) text = `<b>${ch.title}</b><br><br>${ch.intro}<br><br>${ch.levels[0]}`;
  else text = ch.levels[currentLevelInChapter] || "Продолжай путь.";
  document.getElementById('story-text').innerHTML = text;
}
function continueStory() {
  document.getElementById('story-screen').style.display = 'none';
  const globalLevel = currentChapter * 10 + currentLevelInChapter;
  startLevel(globalLevel + 1);
}
function startEndless() {
  mode = 'endless';
  document.getElementById('menu').style.display = 'none';
  document.getElementById('score-display').style.display = 'inline';
  startLevel(1);
}
function updateUnlockedTowers() {
  const unlocked = ['archer'];
  if (currentChapter >= 0 && (currentLevelInChapter >= 2 || currentChapter > 0)) unlocked.push('cannon');
  if (currentChapter >= 1) unlocked.push('mage');
  if (currentChapter >= 1 && currentLevelInChapter >= 3) unlocked.push('ice');
  if (currentChapter >= 2) unlocked.push('ice');
  document.querySelectorAll('.tower-btn').forEach(btn => {
    const type = btn.id.replace('btn-', '');
    if (unlocked.includes(type) || mode === 'endless') {
      btn.style.display = 'flex';
      btn.style.opacity = '1';
    } else {
      btn.style.display = 'none';
    }
  });
}
function startLevel(level) {
  generatePath();
  gold = 140 + level * 15;
  lives = 18 + Math.floor(level / 2);
  wave = 0; score = 0;
  enemies = []; towers = []; projectiles = []; particles = [];
  selectedTower = null;
  updateUnlockedTowers();
  updateHUD();
  document.getElementById('canvas-container').style.display = 'block';
  gameRunning = true;
  playSound('wave');
  nextWave();
  requestAnimationFrame(loop);
}
function backToMenu() {
  gameRunning = false;
  document.getElementById('canvas-container').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('score-display').style.display = 'none';
  loadRanking();
}

function selectTower(type) {
  selectedTower = type;
  upgradeMode = false;
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-' + type).classList.add('selected');
  playSound('place');
}

function selectUpgradeMode() {
  upgradeMode = true;
  selectedTower = null;
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-upgrade').classList.add('selected');
  playSound('place');
}

canvas.addEventListener('click', (e) => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  // Клик по башне
  for (const t of towers) {
    if (Math.hypot(x - t.x, y - t.y) < 30) {
      if (upgradeMode) upgradeTower(t);
      return;
    }
  }

  if (!selectedTower || upgradeMode) return;
  const cost = towerStats[selectedTower].cost;
  if (gold >= cost) {
    let tooClose = path.some(p => Math.hypot(x - p.x, y - p.y) < 45);
    if (!tooClose) {
      towers.push({
        x, y, type: selectedTower,
        range: towerStats[selectedTower].range,
        damage: towerStats[selectedTower].damage,
        cooldown: towerStats[selectedTower].cooldown,
        lastShot: 0,
        angle: 0,
        level: 1
      });
      gold -= cost;
      updateHUD();
      playSound('place');
    }
  }
});

function upgradeTower(t) {
  const stats = towerStats[t.type];
  const maxLevel = (towerImages[t.type] || []).length;
  if (t.level >= maxLevel) {
    alert('Башня уже максимального уровня');
    return;
  }
  const cost = stats.upgradeCost[t.level - 1];
  if (gold < cost) {
    alert('Не хватает золота. Нужно ' + cost);
    return;
  }
  gold -= cost;
  t.level++;
  t.damage = Math.round(t.damage * 1.65);
  t.range = Math.round(t.range * 1.12);
  updateHUD();
  playSound('place');
  createParticles(t.x, t.y, '#ffd700');
}

function nextWave() {
  wave++;
  updateHUD();
  playSound('wave');
  const globalLevel = mode === 'story' ? (currentChapter * 10 + currentLevelInChapter + 1) : wave;
  const count = mode === 'endless' ? 4 + wave * 2 : Math.max(3, 2 + Math.floor(globalLevel / 2));
  const delay = Math.max(400, 800 - globalLevel * 15);
  let type = 'goblin';
  if (globalLevel >= 20) type = wave % 3 === 0 ? 'darkmage' : (wave % 2 === 0 ? 'beast' : 'skeleton');
  else if (globalLevel >= 10) type = wave % 3 === 0 ? 'skeleton' : (wave % 2 === 0 ? 'orc' : 'goblin');
  else if (wave % 3 === 0) type = 'orc';
  else type = 'goblin';
  for (let i = 0; i < count; i++) setTimeout(() => spawnEnemy(type, globalLevel), i * delay);
  if (mode === 'endless') score = wave;
}

function spawnEnemy(type, globalLevel = 1) {
  let hp = 40 + globalLevel * 4, speed = 1.1 + globalLevel * 0.03, reward = 8 + Math.floor(globalLevel / 2);
  if (type === 'orc') { hp *= 1.8; speed *= 0.7; reward *= 1.6; }
  else if (type === 'skeleton') { hp *= 1.4; speed *= 0.85; reward *= 1.3; }
  else if (type === 'beast') { hp *= 1.3; speed *= 1.3; reward *= 1.2; }
  else if (type === 'darkmage') { hp *= 2.2; speed *= 0.6; reward *= 2; }
  enemies.push({
    pathIndex: 0, progress: 0, hp: Math.round(hp), maxHp: Math.round(hp), speed, baseSpeed: speed, type, reward: Math.round(reward),
    x: path[0].x, y: path[0].y, slowTimer: 0
  });
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.slowTimer > 0) { e.slowTimer -= dt; e.speed = e.baseSpeed * 0.5; } else e.speed = e.baseSpeed;
    if (e.pathIndex >= path.length - 1) {
      lives--; enemies.splice(i, 1);
      if (lives <= 0) { gameOver(); return; }
      continue;
    }
    const a = path[e.pathIndex], b = path[e.pathIndex + 1];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    e.progress += (e.speed * dt) / dist;
    if (e.progress >= 1) { e.progress = 0; e.pathIndex++; if (e.pathIndex >= path.length - 1) continue; }
    const pa = path[e.pathIndex], pb = path[e.pathIndex + 1];
    e.x = pa.x + (pb.x - pa.x) * e.progress;
    e.y = pa.y + (pb.y - pa.y) * e.progress;
  }
  if (enemies.length === 0 && gameRunning && wave > 0) {
    gold += 25 + wave * 4;
    const globalLevel = currentChapter * 10 + currentLevelInChapter + 1;
    if (mode === 'story' && wave >= Math.max(3, 2 + Math.floor(globalLevel / 3))) {
      setTimeout(() => {
        gameRunning = false;
        alert('Уровень пройден!');
        playerProgress.storyLevel = (currentChapter * 10 + currentLevelInChapter) + 1;
        saveProgress();
        currentLevelInChapter++;
        if (currentLevelInChapter >= 10) {
          currentLevelInChapter = 0;
          currentChapter++;
          if (currentChapter >= chapters.length) {
            alert('Ты прошёл всю историю! Королевство спасено.');
            backToMenu();
            return;
          }
        }
        document.getElementById('canvas-container').style.display = 'none';
        showStory();
      }, 800);
    } else setTimeout(nextWave, 1800);
  }
}

function updateTowers(time) {
  for (const t of towers) {
    if (time - t.lastShot < t.cooldown) continue;
    let target = null, minDist = t.range;
    for (const e of enemies) {
      const d = Math.hypot(e.x - t.x, e.y - t.y);
      if (d < minDist) { minDist = d; target = e; }
    }
    if (target) {
      t.angle = Math.atan2(target.y - t.y, target.x - t.x);
      projectiles.push({
        x: t.x, y: t.y, tx: target.x, ty: target.y, target,
        damage: t.damage, speed: 9, type: t.type
      });
      t.lastShot = time;
      playSound('shoot');
    }
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }
    const dx = p.target.x - p.x, dy = p.target.y - p.y, dist = Math.hypot(dx, dy);
    if (dist < 12) {
      p.target.hp -= p.damage;
      if (p.type === 'ice') p.target.slowTimer = 120;
      createParticles(p.target.x, p.target.y, p.type === 'mage' ? '#66f' : '#ff0');
      showDamage(p.target.x, p.target.y, p.damage);
      playSound('hit');
      if (p.target.hp <= 0) {
        gold += p.target.reward || 9;
        const idx = enemies.indexOf(p.target);
        if (idx !== -1) enemies.splice(idx, 1);
      }
      projectiles.splice(i, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  }
}

function createParticles(x, y, color) {
  for (let i = 0; i < 14; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7 - 1.5,
      life: 28 + Math.random() * 18,
      color,
      size: 2 + Math.random() * 5
    });
  }
}
function showDamage(x, y, dmg) {
  const el = document.createElement('div');
  el.className = 'dmg';
  el.textContent = '-' + dmg;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.getElementById('canvas-container').appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function gameOver() {
  gameRunning = false;
  playSound('death');
  if (mode === 'endless') {
    playerProgress.bestEndless = Math.max(playerProgress.bestEndless, score);
    saveProgress();
    saveScore(score);
    alert(`Игра окончена! Ваш рейтинг: ${score} волн`);
  } else alert('Вы проиграли уровень. Попробуйте снова!');
  backToMenu();
}

async function saveScore(s) {
  const user = getTelegramUser();
  const userId = user?.id || 'local_' + Date.now();
  const name = user?.username ? '@' + user.username : (user?.first_name || 'Игрок');
  // Local fallback
  let scores = JSON.parse(localStorage.getItem('td_scores') || '[]');
  scores.push({ score: s, name, date: new Date().toLocaleDateString() });
  scores.sort((a,b) => b.score - a.score);
  localStorage.setItem('td_scores', JSON.stringify(scores.slice(0, 10)));
  // Try backend
  if (user && backendUrl !== 'https://your-backend.example.com') {
    try {
      await fetch(backendUrl + '/api/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, name, score: s, initData: tg?.initData })
      });
    } catch(e) {}
  }
}

async function loadRanking() {
  let html = '<h3>Топ рейтинг</h3>';
  try {
    const res = await fetch(backendUrl + '/api/leaderboard');
    const data = await res.json();
    if (data.length) {
      data.forEach((s, i) => html += `<p>${i+1}. ${s.name}: ${s.score} волн</p>`);
    } else throw new Error();
  } catch {
    const scores = JSON.parse(localStorage.getItem('td_scores') || '[]');
    if (!scores.length) html += '<p>Пока нет рекордов</p>';
    else scores.forEach((s, i) => html += `<p>${i+1}. ${s.score} волн (${s.date})</p>`);
  }
  document.getElementById('ranking').innerHTML = html;
}

function openShop() { document.getElementById('menu').style.display = 'none'; document.getElementById('shop').style.display = 'flex'; }
function closeShop() { document.getElementById('shop').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; }

async function buyStars(item) {
  if (!tg) { alert('Только внутри Telegram'); return; }
  try {
    const res = await fetch(backendUrl + '/api/invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item, initData: tg.initData, userId: tg.initDataUnsafe?.user?.id })
    });
    const { link } = await res.json();
    if (link) {
      tg.openInvoice(link, (status) => {
        if (status === 'paid') {
          alert('Оплата успешна! Награда выдана.');
          // В реальности бэкенд выдаёт через successful_payment
        }
      });
    }
  } catch(e) { alert('Ошибка создания счёта. Проверь бэкенд.'); }
}

function updateHUD() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = wave;
  document.getElementById('score').textContent = score;
}

let lastTime = 0;
function loop(time) {
  if (!gameRunning) return;
  const dt = Math.min((time - lastTime) / 16, 2.5);
  lastTime = time;
  updateEnemies(dt);
  updateTowers(time);
  updateProjectiles(dt);
  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.18; // лёгкая гравитация
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  updateHUD();
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (bg.complete) ctx.drawImage(bg, 0, 0, W, H);
  else { ctx.fillStyle = '#2d5a27'; ctx.fillRect(0,0,W,H); }

  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();

  for (const t of towers) {
    const imgsList = towerImages[t.type] || [];
    const imgName = imgsList[Math.min(t.level - 1, imgsList.length - 1)];
    const img = new Image();
    if (imgName) img.src = 'imagine_images/' + imgName;
    const size = 48 + (t.level - 1) * 4;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.angle + Math.PI/2);
    if (img.complete && imgName) ctx.drawImage(img, -size/2, -size/2, size, size);
    else { ctx.fillStyle = towerStats[t.type].color; ctx.fillRect(-20,-20,40,40); }
    // Номер уровня
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(t.level, 0, size/2 + 8);
    ctx.restore();
  }

  for (const e of enemies) {
    let img = imgs.goblin;
    if (e.type === 'orc') img = imgs.orc;
    else if (e.type === 'skeleton') img = imgs.skeleton;
    else if (e.type === 'darkmage') img = imgs.darkmage;
    else if (e.type === 'beast') img = imgs.beast;
    const size = e.type === 'orc' || e.type === 'darkmage' ? 38 : 30;

    // Вычисляем угол движения
    let angle = 0;
    if (e.pathIndex < path.length - 1) {
      const a = path[e.pathIndex];
      const b = path[e.pathIndex + 1];
      angle = Math.atan2(b.y - a.y, b.x - a.x);
    }

    // Более живая анимация бега
    const time = Date.now() / 100;
    const bounce = Math.sin(time + e.x * 0.05) * 5;
    const tilt = Math.sin(time * 1.5 + e.y * 0.03) * 0.15; // лёгкое покачивание
    const scaleY = 1 + Math.sin(time * 2) * 0.06; // растягивание при беге

    ctx.save();
    ctx.translate(e.x, e.y + bounce);
    ctx.rotate(angle + tilt);
    ctx.scale(1, scaleY);

    // Тень (двигается вместе с прыжком)
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(0, size/2 + 2, size/3.2, 5, 0, 0, Math.PI*2);
    ctx.fill();

    if (img && img.complete) {
      ctx.drawImage(img, -size/2, -size/2, size, size);
    } else {
      ctx.fillStyle = '#0a0';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // Полоска здоровья
    ctx.fillStyle = '#f00';
    ctx.fillRect(e.x - 14, e.y - 22 + bounce, 28, 4);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(e.x - 14, e.y - 22 + bounce, 28 * (e.hp / e.maxHp), 4);
  }

  for (const p of projectiles) {
    if (imgs.proj.complete && p.type === 'mage') ctx.drawImage(imgs.proj, p.x-6, p.y-6, 12, 12);
    else { ctx.fillStyle = p.type === 'ice' ? '#8cf' : '#ff0'; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); }
  }

  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15; // гравитация
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

loadRanking();
</script>
